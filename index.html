<title>ТЗ Асель 2 · Депутатский</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Вертикальная лента слайдов 16:9; видео поверх слайда стартует, когда слайд попадает в кадр */
:root{
  --bg:#F6F4F3; --card:#FFFFFF; --fg:#1F1919; --muted:#7D7474; --line:#E2DCDC;
  --display:'Jost','Segoe UI',system-ui,sans-serif;
  --body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131010; --card:#1B1717; --fg:#EDE8E8; --muted:#948B8B; --line:#2B2525; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131010; --card:#1B1717; --fg:#EDE8E8; --muted:#948B8B; --line:#2B2525; color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--body);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card);}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line);}
.bar{max-width:1480px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
.name{font-family:var(--display);font-weight:600;font-size:1rem;margin:0;}
.sub{font-size:.8rem;color:var(--muted);margin:0;}
.mark{margin-left:auto;font-family:var(--display);font-weight:500;font-size:.7rem;
  letter-spacing:.22em;color:var(--muted);text-transform:uppercase;}

main{max-width:1480px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 56px;display:flex;flex-direction:column;gap:28px;}
figure{margin:0;display:flex;flex-direction:column;gap:8px;}
.num{font-family:var(--display);font-size:.7rem;letter-spacing:.2em;color:var(--muted);font-variant-numeric:tabular-nums;}
.frame{position:relative;aspect-ratio:16/9;max-width:100%;
  background:var(--card);border:1px solid var(--line);border-radius:3px;overflow:hidden;}
.frame img{display:block;width:100%;height:100%;object-fit:contain;}
.frame video{position:absolute;width:100%;height:100%;object-fit:cover;background:#000;border:0;}
.sound{position:absolute;z-index:2;border:0;cursor:pointer;
  font-family:var(--display);font-size:.72rem;letter-spacing:.08em;
  padding:7px 12px;border-radius:999px;color:#fff;background:rgba(20,16,16,.62);
  backdrop-filter:blur(6px);}
.sound:focus-visible{outline:2px solid #fff;outline-offset:2px;}
footer{border-top:1px solid var(--line);max-width:1480px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:22px 34px;font-size:.82rem;color:var(--muted);}
@media (max-width:560px){ main{gap:20px;padding-block:14px 40px;} .name{font-size:.92rem;} .mark{display:none;} }
@media (prefers-reduced-motion:reduce){ video{scroll-behavior:auto;} }
</style>

<header>
  <div class="bar">
    <p class="name">Астана — Асель, Нурлан · Депутатский</p>
    <p class="sub">ТЗ АСЕЛЬ 2 · 24 слайда · 09.11.2026</p>
    <span class="mark">Antonovych</span>
  </div>
</header>

<main id="deck"></main>

<footer>
  Antonovych Design · техническое задание по объекту на Депутатском. Видео запускается само, когда слайд попадает на экран; звук включается кнопкой.
</footer>

<script>
const VIDEOS = {
  5:  {src:'slides/v1.mp4', css:'left:65.93%;top:2.38%;width:29.65%;height:93.71%'},
  7:  {src:'slides/v2.mp4', css:'left:63.99%;top:0.70%;width:31.09%;height:98.26%'},
  8:  {src:'slides/v3.mp4', css:'left:54.95%;top:0%;width:45.05%;height:100%'},
  17: {src:'slides/v4.mp4', css:'left:62.66%;top:-0.60%;width:31.83%;height:100.60%'}
};
const ALT = {
  1:'Титульный слайд', 2:'Правила сохранения визуализаций', 3:'Общая информация по проекту',
  4:'Референс заказчика по стилистике', 5:'Гостиная, столовая — атриумы', 6:'Кухня — референсы заказчика',
  7:'Кухня — красный мрамор Rosso Levanto', 8:'Гостиная, столовая — работа с видео',
  9:'Гостиная, столовая — диван Flexform Groundpiece', 10:'Гостиная, столовая — ТВ-зона из травертина',
  11:'Гостиная, столовая — стол и витрины Poliform', 12:'Кабинеты возле атриума',
  13:'Спальня хозяйская — люстра Henge', 14:'Мастер-гардероб Poliform', 15:'Мастер-гардероб — референсы',
  16:'Туалетный столик Poliform, люстра над островом', 17:'Санузлы — Modulnova',
  18:'Санузлы', 19:'Санузлы', 20:'Санузлы', 21:'Санузлы',
  22:'Гостевая спальня — Baxter, Minotti', 23:'Гардеробы — референс', 24:'Завершающий слайд'
};

const deck = document.getElementById('deck');
for (let n = 1; n <= 24; n++) {
  const pad = String(n).padStart(2, '0');
  const fig = document.createElement('figure');
  const num = document.createElement('span');
  num.className = 'num';
  num.textContent = VIDEOS[n] ? pad + ' · видео' : pad;
  const frame = document.createElement('div');
  frame.className = 'frame';
  const img = document.createElement('img');
  img.src = 'slides/s-' + pad + '.jpg';
  img.alt = ALT[n] || ('Слайд ' + n);
  img.loading = n > 2 ? 'lazy' : 'eager';
  frame.append(img);
  if (VIDEOS[n]) {
    const v = document.createElement('video');
    v.src = VIDEOS[n].src;
    v.muted = true; v.loop = true; v.playsInline = true;
    v.setAttribute('playsinline', ''); v.setAttribute('muted', '');
    v.preload = 'metadata';
    v.style.cssText = VIDEOS[n].css;
    const btn = document.createElement('button');
    btn.className = 'sound';
    btn.type = 'button';
    btn.textContent = 'ЗВУК ВКЛ';
    btn.style.right = '16px';
    btn.style.bottom = '16px';
    btn.addEventListener('click', () => {
      v.muted = !v.muted;
      btn.textContent = v.muted ? 'ЗВУК ВКЛ' : 'ЗВУК ВЫКЛ';
      if (!v.muted) v.play().catch(() => {});
    });
    frame.append(v, btn);
  }
  fig.append(num, frame);
  deck.append(fig);
}

const io = new IntersectionObserver((entries) => {
  for (const e of entries) {
    const v = e.target;
    if (e.isIntersecting) { v.play().catch(() => {}); }
    else { v.pause(); }
  }
}, { threshold: 0.45 });
document.querySelectorAll('video').forEach(v => io.observe(v));
</script>
