<title>ТЗ Асель 2 · Депутатский</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Один слайд на экран: кадр вписан по высоте окна, листание стрелками, свайпом и кнопками */
:root{
  --bg:#F6F4F3; --card:#FFFFFF; --fg:#1F1919; --muted:#7D7474; --line:#E2DCDC;
  --display:'Jost','Segoe UI',system-ui,sans-serif;
  --body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
  --chrome:128px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131010; --card:#1B1717; --fg:#EDE8E8; --muted:#948B8B; --line:#2B2525; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131010; --card:#1B1717; --fg:#EDE8E8; --muted:#948B8B; --line:#2B2525; color-scheme:dark;
}
html,body{height:100%;}
body{background:var(--bg);color:var(--fg);font-family:var(--body);
  display:flex;flex-direction:column;overflow:hidden;}

header{background:var(--card);border-bottom:1px solid var(--line);flex:0 0 auto;}
.bar{max-width:1600px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px;display:flex;align-items:baseline;gap:12px;}
.name{font-family:var(--display);font-weight:600;font-size:.92rem;margin:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sub{font-size:.78rem;color:var(--muted);white-space:nowrap;}
.mark{margin-left:auto;font-family:var(--display);font-weight:500;font-size:.66rem;
  letter-spacing:.22em;color:var(--muted);text-transform:uppercase;white-space:nowrap;}

.stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;}
.frame{position:relative;aspect-ratio:16/9;
  width:min(100%, 1600px, calc((100dvh - var(--chrome)) * 1.7778));
  background:var(--card);border:1px solid var(--line);border-radius:3px;overflow:hidden;}
.frame img{display:block;width:100%;height:100%;object-fit:contain;}
.frame video{position:absolute;width:100%;height:100%;object-fit:cover;background:#000;border:0;}

.sound{position:absolute;right:14px;bottom:14px;z-index:3;border:0;cursor:pointer;
  font-family:var(--display);font-size:.7rem;letter-spacing:.08em;
  padding:7px 12px;border-radius:999px;color:#fff;background:rgba(20,16,16,.62);}

.controls{flex:0 0 auto;background:var(--card);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;justify-content:center;gap:14px;}
.nav{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);
  background:transparent;color:var(--fg);cursor:pointer;font-size:1.1rem;line-height:1;
  display:grid;place-items:center;}
.nav:hover:not(:disabled){background:var(--bg);}
.nav:disabled{opacity:.3;cursor:default;}
.nav:focus-visible,.sound:focus-visible{outline:2px solid var(--fg);outline-offset:2px;}
.count{font-family:var(--display);font-size:.84rem;color:var(--muted);
  font-variant-numeric:tabular-nums;min-width:86px;text-align:center;}
.count b{color:var(--fg);font-weight:600;}
.caption{font-size:.8rem;color:var(--muted);max-width:40ch;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
@media (max-width:720px){ .caption{display:none;} .mark{display:none;} .sub{display:none;} }
</style>

<header id="head">
  <div class="bar">
    <p class="name">Астана — Асель, Нурлан · ДНД</p>
    <span class="sub">ТЗ АСЕЛЬ 2 · стилистика · 51 слайд · 11.11.2026</span>
    <span class="mark">Antonovych</span>
  </div>
</header>

<div class="stage">
  <div class="frame" id="frame">
    <img id="shot" alt="">
  </div>
</div>

<div class="controls">
  <button class="nav" id="prev" type="button" aria-label="Предыдущий слайд">‹</button>
  <span class="count"><b id="cur">1</b> / 51</span>
  <button class="nav" id="next" type="button" aria-label="Следующий слайд">›</button>
  <span class="caption" id="caption"></span>
</div>

<script>
const TOTAL = 51;
const VIDEOS = {
  34: {src:'slides/v1.mp4', css:'left:65.93%;top:2.38%;width:29.65%;height:93.71%'},
  35: {src:'slides/v2.mp4', css:'left:11.51%;top:0.86%;width:31.09%;height:98.26%'},
  37: {src:'slides/v3.mp4', css:'left:54.95%;top:0%;width:45.05%;height:100%'},
  46: {src:'slides/v4.mp4', css:'left:62.66%;top:-0.60%;width:31.83%;height:100.60%'}
};
const PLANS = { 32:'slides/plan-1.jpg', 33:'slides/plan-2.jpg' };
const ALT = {
  1:'Титульный слайд',
  2:'Стилистика проекта',
  3:'Стилистика проекта',
  4:'Стилистика проекта',
  5:'Экстерьер',
  6:'Экстерьер',
  7:'Стилистика проекта',
  8:'Стилистика проекта',
  9:'Стилистика проекта',
  10:'Стилистика проекта',
  11:'Стилистика проекта',
  12:'Стилистика проекта',
  13:'Стилистика проекта',
  14:'Дизайн лестниц',
  15:'Дизайн лестниц',
  16:'Дизайн лестниц',
  17:'Варианты лифтов',
  18:'Варианты лифтов',
  19:'Варианты лифтов',
  20:'Варианты лифтов',
  21:'Дизайн лестниц',
  22:'Дизайн лестниц',
  23:'Дизайн лестниц',
  24:'Дизайн лестниц',
  25:'Дизайн лестниц',
  26:'Дизайн лестниц',
  27:'Дизайн лестниц',
  28:'Перила в стене',
  29:'Перила в стене',
  30:'Перила в стене',
  31:'Перила в стене',
  32:'План 1 этажа',
  33:'План 2 этажа',
  34:'Гостиная, столовая',
  35:'Кухня',
  36:'Кухня',
  37:'Гостиная, столовая',
  38:'Гостиная, столовая',
  39:'Гостиная, столовая',
  40:'Гостиная, столовая',
  41:'Кабинеты возле атриума',
  42:'Спальня хозяйская',
  43:'Мастер-гардероб',
  44:'Мастер-гардероб — референсы',
  45:'Люстра над островом',
  46:'Санузлы',
  47:'Санузлы',
  48:'Санузлы',
  49:'Санузлы',
  50:'Гостевая спальня',
  51:'Гардеробы'
};
const pad = n => String(n).padStart(2, '0');
const head = document.getElementById('head');
const shot = document.getElementById('shot');
const frame = document.getElementById('frame');
const curEl = document.getElementById('cur');
const capEl = document.getElementById('caption');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
let i = 1, media = null;

function clearMedia(){
  frame.querySelectorAll('a.sound').forEach(a => a.remove());
  if (!media) return;
  media.video.pause();
  media.video.remove();
  media.btn.remove();
  media = null;
}

function sizeChrome(){
  const h = (head.hidden ? 0 : head.offsetHeight)
          + document.querySelector('.controls').offsetHeight + 26;
  document.documentElement.style.setProperty('--chrome', h + 'px');
}

function show(n){
  i = Math.min(TOTAL, Math.max(1, n));
  clearMedia();
  head.hidden = i !== 1;
  sizeChrome();
  shot.src = 'slides/s-' + pad(i) + '.jpg';
  shot.alt = ALT[i] || ('Слайд ' + i);
  curEl.textContent = i;
  capEl.textContent = ALT[i] || '';
  prevBtn.disabled = i === 1;
  nextBtn.disabled = i === TOTAL;
  const v = VIDEOS[i];
  if (v){
    const el = document.createElement('video');
    el.src = v.src; el.muted = true; el.loop = true; el.playsInline = true;
    el.setAttribute('playsinline',''); el.setAttribute('muted','');
    el.style.cssText = v.css;
    const btn = document.createElement('button');
    btn.className = 'sound'; btn.type = 'button'; btn.textContent = 'ЗВУК ВКЛ';
    btn.addEventListener('click', () => {
      el.muted = !el.muted;
      btn.textContent = el.muted ? 'ЗВУК ВКЛ' : 'ЗВУК ВЫКЛ';
      el.play().catch(() => {});
    });
    frame.append(el, btn);
    media = {video: el, btn};
    el.play().catch(() => {});
  }
  if (PLANS[i]){
    const a = document.createElement('a');
    a.className = 'sound'; a.textContent = 'ПЛАН ЦЕЛИКОМ';
    a.href = PLANS[i]; a.target = '_blank'; a.rel = 'noopener';
    a.style.textDecoration = 'none';
    frame.append(a);
  }
  for (const d of [1, -1]){
    const m = i + d;
    if (m >= 1 && m <= TOTAL) { const p = new Image(); p.src = 'slides/s-' + pad(m) + '.jpg'; }
  }
  if (location.hash !== '#' + i) history.replaceState(null, '', '#' + i);
}

prevBtn.addEventListener('click', () => show(i - 1));
nextBtn.addEventListener('click', () => show(i + 1));

addEventListener('keydown', e => {
  if (e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
  switch (e.key){
    case 'ArrowRight': case 'PageDown': case ' ': show(i + 1); e.preventDefault(); break;
    case 'ArrowLeft':  case 'PageUp':            show(i - 1); e.preventDefault(); break;
    case 'Home': show(1); e.preventDefault(); break;
    case 'End':  show(TOTAL); e.preventDefault(); break;
  }
});

let x0 = null, y0 = null;
frame.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
frame.addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  const dy = e.changedTouches[0].clientY - y0;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) show(i + (dx < 0 ? 1 : -1));
  x0 = y0 = null;
}, {passive:true});

addEventListener('resize', sizeChrome);

const start = parseInt((location.hash || '').slice(1), 10);
show(Number.isInteger(start) && start >= 1 && start <= TOTAL ? start : 1);
addEventListener('hashchange', () => {
  const n = parseInt(location.hash.slice(1), 10);
  if (Number.isInteger(n) && n !== i) show(n);
});
</script>
